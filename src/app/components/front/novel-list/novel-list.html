
    <h2>Nos romans</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>id</th>
            <th>Titre</th>
            <th>Infos</th>
        </tr>
    </thead>
    <tbody>
        @for(book of novels(); track book.id ){
        <tr>
            <td> {{book.id}}</td>
            <td>{{book.title |titlecase }}</td>
            <td><button class="btn btn-info" [routerLink]="['/allBooks/novels',book.id]">Infos</button></td>
        </tr>
        }
    </tbody>
</table>
